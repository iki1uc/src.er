  font-family:"Arial Narrow",ui-sans-serif,system-ui,sans-serif;
  letter-spacing:.04em;
}
.blueprint-bg{
  background-image:
    linear-gradient(rgba(55,200,232,.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(55,200,232,.07) 1px, transparent 1px),
    linear-gradient(rgba(55,200,232,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(55,200,232,.035) 1px, transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;
}
.node-btn{
  transition:all .15s ease;
}
.node-btn:hover{
  border-color:var(--cyan);
}
.node-btn.active{
  border-color:var(--accent);
  background:var(--surface2);
  box-shadow:0 0 0 1px var(--accent), 0 0 18px rgba(255,176,46,.18);
}
.chip{
  border:1px solid var(--line);
}
@keyframes dashmove{
  to{
    stroke-dashoffset:-24;
  }
}
.flowline{
  stroke-dasharray:6 6;
  animation:dashmove 1.2s linear infinite;
}
@keyframes pulse-dot{
  0%,100%{
    opacity:1
  }
  50%{
    opacity:.25
  }
}
.pulse-dot{
  animation:pulse-dot 1.6s ease-in-out infinite;
}
.hover\:border-\[var\(--accent\)\]:hover {
  border-color: var(--accent);
}
@media (min-width: 640px) {
  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .sm\:text-xl {
    font-size: 1.25rem;
    line-height: 1.75rem;
  }
}
@media (min-width: 768px) {
  .md\:col-span-2 {
    grid-column: span 2 / span 2;
  }
  .md\:col-span-3 {
    grid-column: span 3 / span 3;
  }
  .md\:block {
    display: block;
  }
  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .md\:grid-cols-5 {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
}
@media (min-width: 1024px) {
  .lg\:block {
    display: block;
  }
  .lg\:grid-cols-9 {
    grid-template-columns: repeat(9, minmax(0, 1fr));
  }
}
